<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .lane { fill: #ffffff; stroke: #d6deea; stroke-width: 1.2; rx: 10; }
      .entry { fill: #eef7ff; stroke: #6fa4d8; stroke-width: 1.5; rx: 8; }
      .service { fill: #fffaf0; stroke: #d8b45f; stroke-width: 1.5; rx: 8; }
      .module { fill: #f2f6ff; stroke: #8ca5d8; stroke-width: 1.5; rx: 8; }
      .data { fill: #edf9f1; stroke: #68aa7b; stroke-width: 1.5; rx: 8; }
      .external { fill: #f4efff; stroke: #9b7dd1; stroke-width: 1.5; rx: 8; }
      .title { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .h { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111827; }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 15px; fill: #1f2937; }
      .small { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 12px; fill: #526071; }
      .tiny { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; font-size: 11px; fill: #5f6b7a; }
      .arrow { stroke: #66758c; stroke-width: 1.7; fill: none; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 6 5; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#66758c"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1180"/>
  <text x="800" y="48" text-anchor="middle" class="title">后端 API 接口流转关系图</text>

  <rect x="40" y="90" width="260" height="1030" class="lane"/>
  <text x="170" y="124" text-anchor="middle" class="h">客户端入口</text>
  <rect x="70" y="160" width="200" height="74" class="entry"/>
  <text x="170" y="190" text-anchor="middle" class="text">Web / Android 前端</text>
  <text x="170" y="212" text-anchor="middle" class="small">App.vue / api/query.ts</text>

  <rect x="340" y="90" width="330" height="1030" class="lane"/>
  <text x="505" y="124" text-anchor="middle" class="h">HTTP API 层</text>
  <text x="505" y="147" text-anchor="middle" class="small">app/api/routes.py</text>

  <rect x="710" y="90" width="380" height="1030" class="lane"/>
  <text x="900" y="124" text-anchor="middle" class="h">业务服务 / 应用逻辑</text>

  <rect x="1130" y="90" width="430" height="1030" class="lane"/>
  <text x="1345" y="124" text-anchor="middle" class="h">外部资源 / 数据源</text>

  <!-- API boxes -->
  <rect x="370" y="165" width="270" height="58" class="entry"/>
  <text x="505" y="190" text-anchor="middle" class="text">GET /api/health</text>
  <text x="505" y="211" text-anchor="middle" class="small">健康检查</text>

  <rect x="370" y="270" width="270" height="70" class="entry"/>
  <text x="505" y="298" text-anchor="middle" class="text">POST /api/query/stream</text>
  <text x="505" y="320" text-anchor="middle" class="small">主聊天接口，SSE 流式返回</text>

  <rect x="370" y="375" width="270" height="70" class="entry"/>
  <text x="505" y="403" text-anchor="middle" class="text">POST /api/query</text>
  <text x="505" y="425" text-anchor="middle" class="small">非流式查询，调试/Android 兜底</text>

  <rect x="370" y="495" width="270" height="70" class="entry"/>
  <text x="505" y="523" text-anchor="middle" class="text">POST /api/asr</text>
  <text x="505" y="545" text-anchor="middle" class="small">录音 base64 转中文文本</text>

  <rect x="370" y="615" width="270" height="70" class="entry"/>
  <text x="505" y="643" text-anchor="middle" class="text">GET /api/photo/file</text>
  <text x="505" y="665" text-anchor="middle" class="small">照片/视频文件代理下载</text>

  <rect x="370" y="720" width="270" height="70" class="entry"/>
  <text x="505" y="748" text-anchor="middle" class="text">GET /api/photo-cache</text>
  <text x="505" y="770" text-anchor="middle" class="small">远程照片缓存与缩略图</text>

  <rect x="370" y="825" width="270" height="70" class="entry"/>
  <text x="505" y="853" text-anchor="middle" class="text">GET /api/displacement/recent-large</text>
  <text x="505" y="875" text-anchor="middle" class="small">近期专业监测位移看板</text>

  <rect x="370" y="930" width="270" height="70" class="entry"/>
  <text x="505" y="958" text-anchor="middle" class="text">GET /api/qmqf/abnormal-dashboard</text>
  <text x="505" y="980" text-anchor="middle" class="small">群测群防异常看板</text>

  <rect x="370" y="1035" width="270" height="70" class="entry"/>
  <text x="505" y="1063" text-anchor="middle" class="text">GET /api/report/*</text>
  <text x="505" y="1085" text-anchor="middle" class="small">月报资产清单 / 稳定性资产</text>

  <!-- Service boxes -->
  <rect x="750" y="245" width="300" height="96" class="service"/>
  <text x="900" y="276" text-anchor="middle" class="text">stream_agent_events</text>
  <text x="900" y="298" text-anchor="middle" class="small">启动后台线程，持续推送进度</text>
  <text x="900" y="318" text-anchor="middle" class="small">最终返回 final 事件</text>

  <rect x="750" y="365" width="300" height="96" class="service"/>
  <text x="900" y="396" text-anchor="middle" class="text">run_agent</text>
  <text x="900" y="418" text-anchor="middle" class="small">自然语言问数主流程</text>
  <text x="900" y="438" text-anchor="middle" class="small">归一化、路由、SQL、报告、附件</text>

  <rect x="750" y="500" width="300" height="78" class="service"/>
  <text x="900" y="530" text-anchor="middle" class="text">transcribe_base64_audio</text>
  <text x="900" y="552" text-anchor="middle" class="small">faster-whisper 本地 ASR</text>

  <rect x="750" y="615" width="300" height="78" class="service"/>
  <text x="900" y="645" text-anchor="middle" class="text">download_photo_file</text>
  <text x="900" y="667" text-anchor="middle" class="small">按 path 代理源文件二进制</text>

  <rect x="750" y="720" width="300" height="78" class="service"/>
  <text x="900" y="750" text-anchor="middle" class="text">get_cached_photo_response</text>
  <text x="900" y="772" text-anchor="middle" class="small">下载、缓存、压缩缩略图</text>

  <rect x="750" y="825" width="300" height="78" class="service"/>
  <text x="900" y="855" text-anchor="middle" class="text">get_recent_displacement_dashboard</text>
  <text x="900" y="877" text-anchor="middle" class="small">专业监测位移数据与图表</text>

  <rect x="750" y="930" width="300" height="78" class="service"/>
  <text x="900" y="960" text-anchor="middle" class="text">get_qmqf_abnormal_dashboard</text>
  <text x="900" y="982" text-anchor="middle" class="small">群测群防异常记录与照片证据</text>

  <rect x="750" y="1035" width="300" height="78" class="service"/>
  <text x="900" y="1065" text-anchor="middle" class="text">report_inventory / report_assets</text>
  <text x="900" y="1087" text-anchor="middle" class="small">月报资产统计与稳定性评价</text>

  <!-- Agent internals -->
  <rect x="1145" y="235" width="175" height="76" class="module"/>
  <text x="1232" y="264" text-anchor="middle" class="text">nlq/*</text>
  <text x="1232" y="286" text-anchor="middle" class="small">问题路由 / 模板 / schema</text>

  <rect x="1145" y="330" width="175" height="76" class="external"/>
  <text x="1232" y="359" text-anchor="middle" class="text">LLM API</text>
  <text x="1232" y="381" text-anchor="middle" class="small">路由 / SQL / 报告</text>

  <rect x="1365" y="235" width="175" height="76" class="data"/>
  <text x="1452" y="264" text-anchor="middle" class="text">达梦主业务库</text>
  <text x="1452" y="286" text-anchor="middle" class="small">DM 10.69.147.141:5236</text>

  <rect x="1365" y="330" width="175" height="76" class="data"/>
  <text x="1452" y="359" text-anchor="middle" class="text">SQL Server 照片库</text>
  <text x="1452" y="381" text-anchor="middle" class="small">1.13.19.44:1433</text>

  <rect x="1365" y="440" width="175" height="76" class="external"/>
  <text x="1452" y="469" text-anchor="middle" class="text">照片文件服务器</text>
  <text x="1452" y="491" text-anchor="middle" class="small">1.13.19.44:8080</text>

  <rect x="1365" y="825" width="175" height="76" class="data"/>
  <text x="1452" y="854" text-anchor="middle" class="text">月报/生成资产</text>
  <text x="1452" y="876" text-anchor="middle" class="small">backend/generated 等</text>

  <!-- arrows from client to routes -->
  <path class="arrow" d="M270 197 L370 194"/>
  <path class="arrow" d="M270 197 C320 220 335 295 370 305"/>
  <path class="arrow" d="M270 197 C320 255 335 395 370 410"/>
  <path class="arrow" d="M270 197 C325 310 335 520 370 530"/>
  <path class="arrow" d="M270 197 C330 390 338 640 370 650"/>
  <path class="arrow" d="M270 197 C330 430 338 745 370 755"/>
  <path class="arrow" d="M270 197 C330 500 338 850 370 860"/>
  <path class="arrow" d="M270 197 C330 560 338 955 370 965"/>
  <path class="arrow" d="M270 197 C330 620 338 1065 370 1070"/>

  <!-- routes to services -->
  <path class="arrow" d="M640 305 L750 293"/>
  <path class="arrow" d="M640 410 L750 413"/>
  <path class="arrow" d="M640 530 L750 539"/>
  <path class="arrow" d="M640 650 L750 654"/>
  <path class="arrow" d="M640 755 L750 759"/>
  <path class="arrow" d="M640 860 L750 864"/>
  <path class="arrow" d="M640 965 L750 969"/>
  <path class="arrow" d="M640 1070 L750 1074"/>

  <!-- service dependencies -->
  <path class="arrow" d="M1050 293 C1105 285 1115 275 1145 273"/>
  <path class="arrow" d="M1050 413 C1105 385 1115 368 1145 368"/>
  <path class="arrow" d="M1050 413 C1210 410 1320 275 1365 273"/>
  <path class="arrow" d="M1050 413 C1215 430 1320 370 1365 368"/>
  <path class="arrow" d="M1320 273 L1365 273"/>
  <path class="arrow" d="M1320 368 L1365 368"/>

  <path class="arrow" d="M1050 654 L1365 478"/>
  <path class="arrow" d="M1050 759 L1365 478"/>
  <path class="arrow" d="M1050 864 L1365 273"/>
  <path class="arrow" d="M1050 864 C1180 880 1280 855 1365 863"/>
  <path class="arrow" d="M1050 969 L1365 368"/>
  <path class="arrow" d="M1050 1074 C1190 1060 1290 890 1365 863"/>

  <path class="arrow dash" d="M1050 293 L1050 365"/>
  <text x="1062" y="348" class="tiny">stream 包装 run_agent</text>

  <text x="770" y="190" class="tiny">/health 不访问业务服务，只返回 {status: ok}</text>
</svg>
