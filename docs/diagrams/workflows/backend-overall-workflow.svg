<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="980" viewBox="0 0 1180 980">
  <defs>
    <style>
      .bg { fill: #f7f9fc; }
      .box { fill: #ffffff; stroke: #c8d3e3; stroke-width: 1.5; rx: 8; }
      .decision { fill: #fff9e8; stroke: #d8b75f; stroke-width: 1.5; }
      .service { fill: #eef7ff; stroke: #7aa8d8; stroke-width: 1.5; rx: 8; }
      .data { fill: #eefaf2; stroke: #73b484; stroke-width: 1.5; rx: 8; }
      .text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #1f2937; font-size: 17px; }
      .small { font-size: 13px; fill: #526071; }
      .title { font-size: 28px; font-weight: 700; fill: #111827; }
      .arrow { stroke: #65758b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .label { font-size: 13px; fill: #42526b; font-family: "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#65758b"/>
    </marker>
  </defs>

  <rect class="bg" width="1180" height="980"/>
  <text x="590" y="52" text-anchor="middle" class="title">高切坡智能问答后端整体工作流</text>

  <rect x="420" y="90" width="340" height="58" class="box"/>
  <text x="590" y="125" text-anchor="middle" class="text">用户输入中文问题</text>

  <rect x="420" y="188" width="340" height="70" class="box"/>
  <text x="590" y="218" text-anchor="middle" class="text">前端发送 SSE 请求</text>
  <text x="590" y="240" text-anchor="middle" class="small">POST /api/query/stream</text>

  <rect x="420" y="298" width="340" height="70" class="service"/>
  <text x="590" y="328" text-anchor="middle" class="text">FastAPI 路由层</text>
  <text x="590" y="350" text-anchor="middle" class="small">app/api/routes.py</text>

  <rect x="420" y="408" width="340" height="70" class="service"/>
  <text x="590" y="438" text-anchor="middle" class="text">Agent 主流程 run_agent</text>
  <text x="590" y="460" text-anchor="middle" class="small">app/services/agent.py</text>

  <rect x="420" y="518" width="340" height="70" class="box"/>
  <text x="590" y="548" text-anchor="middle" class="text">问题归一化 + 路由判断</text>
  <text x="590" y="570" text-anchor="middle" class="small">question_normalizer.py / query_router.py</text>

  <polygon points="590,628 760,700 590,772 420,700" class="decision"/>
  <text x="590" y="693" text-anchor="middle" class="text">路由结果</text>
  <text x="590" y="716" text-anchor="middle" class="small">query_type / status</text>

  <rect x="60" y="820" width="220" height="82" class="box"/>
  <text x="170" y="852" text-anchor="middle" class="text">澄清/拒答/闲聊</text>
  <text x="170" y="876" text-anchor="middle" class="small">直接返回说明</text>

  <rect x="330" y="820" width="220" height="82" class="data"/>
  <text x="440" y="852" text-anchor="middle" class="text">照片专用链路</text>
  <text x="440" y="876" text-anchor="middle" class="small">查 SQL Server 照片库</text>

  <rect x="600" y="820" width="220" height="82" class="data"/>
  <text x="710" y="852" text-anchor="middle" class="text">稳定模板 SQL</text>
  <text x="710" y="876" text-anchor="middle" class="small">business_queries.py</text>

  <rect x="870" y="820" width="250" height="82" class="data"/>
  <text x="995" y="852" text-anchor="middle" class="text">普通 NL2SQL 查询</text>
  <text x="995" y="876" text-anchor="middle" class="small">Schema 召回 + SQL Agent</text>

  <path class="arrow" d="M590 148 L590 188"/>
  <path class="arrow" d="M590 258 L590 298"/>
  <path class="arrow" d="M590 368 L590 408"/>
  <path class="arrow" d="M590 478 L590 518"/>
  <path class="arrow" d="M590 588 L590 628"/>
  <path class="arrow" d="M420 700 C300 710 215 760 170 820"/>
  <path class="arrow" d="M520 756 C485 780 455 800 440 820"/>
  <path class="arrow" d="M650 756 C680 780 700 800 710 820"/>
  <path class="arrow" d="M760 700 C880 710 960 770 995 820"/>

  <text x="220" y="764" class="label">chat / clarify / out_of_scope</text>
  <text x="425" y="790" class="label">照片/图片/视频</text>
  <text x="660" y="790" class="label">template_query</text>
  <text x="910" y="764" class="label">db_query / result_analysis</text>
</svg>
